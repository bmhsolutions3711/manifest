<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="Manifest — know what you're carrying. AI intelligence for builders on the move. Open when you want. No pings." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Manifest" />
  <title>Manifest</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1220'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%2338bdf8'/%3E%3C/svg%3E" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <span class="mark" aria-hidden="true"></span>
        <div>
          <h1>Manifest</h1>
          <p class="tag">Know what you're carrying · ET · no pings</p>
        </div>
      </div>
      <div class="top-right">
        <span id="version-pill" class="version-pill" title="App version">v0.2.0</span>
        <button type="button" id="btn-refresh" class="ghost icon-btn" title="Reload" aria-label="Reload">↻</button>
      </div>
    </header>

    <nav class="filters" aria-label="Filter briefings">
      <button type="button" class="chip active" data-filter="all">All</button>
      <button type="button" class="chip" data-filter="weekday">Weekday</button>
      <button type="button" class="chip" data-filter="sunday">Sunday</button>
    </nav>

    <p id="status" class="status" role="status"></p>

    <main id="list-view">
      <section id="list" class="list" aria-label="Briefing history"></section>
      <p class="hint">Tap a card. Listen or skim. Full walls of text optional.</p>
    </main>

    <section id="detail-view" class="detail" hidden>
      <div class="detail-bar">
        <button type="button" id="btn-back" class="ghost">← Back</button>
        <div class="detail-actions">
          <button type="button" id="btn-listen" class="primary listen-btn">▶ Listen</button>
          <button type="button" id="btn-stop" class="ghost" hidden>Stop</button>
        </div>
      </div>

      <div id="player-bar" class="player-bar" hidden>
        <div class="player-wave" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <p id="player-label" class="player-label">Playing summary…</p>
      </div>

      <header id="detail-hero" class="detail-hero"></header>

      <div class="mode-toggle" role="tablist" aria-label="View mode">
        <button type="button" class="mode-chip active" data-mode="drive" role="tab" aria-selected="true">Drive mode</button>
        <button type="button" class="mode-chip" data-mode="deep" role="tab" aria-selected="false">Deep dive</button>
      </div>

      <div id="drive-view" class="drive-view"></div>
      <article id="detail-body" class="prose deep-view" hidden></article>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
